name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Vérification des liens Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les liens avec Lychee
        uses: lycheeverse/lychee-action@v2
        env:
          # Évite les erreurs 429 (Rate Limit) sur les nombreux liens github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # fail: true fait échouer le job si un lien est cassé (remplace l'ancienne étape)
          fail: true
          args: >-
            --verbose
            --timeout 40
            --insecure
            --accept 200..=204,403,429
            *.md
